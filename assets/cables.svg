<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Three cables, then your agents take over</title>
  <desc id="d">Your Mac on the left and a small IP-KVM in the middle. Cable 1 is HDMI from the Mac into the KVM: its eyes. Cable 2 is USB-C from the KVM into the Mac: its hands, a keyboard and mouse that work even at the FileVault screen. Cable 3 is Ethernet from the KVM to your network: its reach, over your tailnet, your LAN, or a GitHub outbox. An optional smart plug on the Mac's power cord, reached by the KVM over Wi-Fi or Bluetooth, lets the sitter restart a Mac that froze. The KVM itself is powered over Ethernet (PoE) or USB-C, never through the smart plug. On the right, your agents and your phone reach the KVM from anywhere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" class="bg0" stop-color="#fff3e3"/>
      <stop offset="1" class="bg1" stop-color="#ffe6c7"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#c9cad1"/>
    </linearGradient>
    <linearGradient id="kvm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5b5f6b"/>
      <stop offset="1" stop-color="#3a3d46"/>
    </linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".45" stop-color="#ffb84a"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b7dd8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a4b22" flood-opacity="0.22"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .n { font-size: 15px; font-weight: 800; fill: #fff; }
      .cable { font-size: 18px; font-weight: 700; fill: #2b2730; }
      .why { font-size: 15px; fill: #6a5e57; }
      .name { font-size: 17px; font-weight: 700; fill: #2b2730; }
      .small { font-size: 14px; fill: #6a5e57; }
      .route { font-size: 15px; font-weight: 600; fill: #2b2730; }
      .bg0 { stop-color: #fff3e3; } .bg1 { stop-color: #ffe6c7; }
      .card { fill: #fffdf9; }
      @media (prefers-color-scheme: dark) {
        .bg0 { stop-color: #23202d; } .bg1 { stop-color: #1b1924; }
        .cable, .name, .route { fill: #f1ece6; } .why, .small { fill: #b9aea6; }
        .card { fill: #2c2938; } .r1 { fill: #3a3354; } .r2 { fill: #26392f; } .r3 { fill: #42331f; }
      }
    </style>
  </defs>
  <rect width="1200" height="470" rx="22" fill="url(#bg)"/>

  <!-- cables -->
  <path d="M290 196 C 380 196, 400 176, 500 176" fill="none" stroke="#3b7dd8" stroke-width="7" stroke-linecap="round" marker-end="url(#ab)"/>
  <path d="M506 226 C 400 226, 380 246, 296 246" fill="none" stroke="#2e9e5b" stroke-width="7" stroke-linecap="round" marker-end="url(#ag)"/>
  <path d="M694 201 C 760 201, 780 201, 852 201" fill="none" stroke="#e28a2b" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M142 290 L 142 384" fill="none" stroke="#9b8f86" stroke-width="5" stroke-linecap="round"/>

  <path d="M150 432 C 150 452, 170 454, 300 454 L 560 454 C 636 454, 640 420, 640 262" fill="none" stroke="#c9a46b" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <text x="654" y="372" class="small">Wi-Fi or Bluetooth</text>

  <!-- the Mac -->
  <g filter="url(#lift)">
    <rect x="110" y="150" width="180" height="140" rx="26" fill="url(#alu)"/>
  </g>
  <rect x="110" y="270" width="180" height="20" rx="10" fill="#b9bac2" opacity=".6"/>
  <circle cx="270" cy="168" r="3" fill="#52d17f"/>
  <text x="200" y="112" text-anchor="middle" class="name">Your Mac</text>
  <text x="200" y="132" text-anchor="middle" class="small">where your agents live</text>

  <!-- the KVM -->
  <g filter="url(#lift)">
    <rect x="506" y="146" width="188" height="110" rx="22" fill="url(#kvm)"/>
  </g>
  <circle cx="600" cy="201" r="34" fill="url(#eye)"/>
  <circle cx="600" cy="201" r="11" fill="#fff4cf"/>
  <text x="600" y="104" text-anchor="middle" class="name">GL.iNet Comet PoE, ~$100</text>
  <text x="600" y="124" text-anchor="middle" class="small">the sitter runs here, powered by PoE</text>

  <!-- smart plug -->
  <g filter="url(#lift)">
    <rect x="110" y="384" width="64" height="48" rx="12" fill="#fafafa"/>
  </g>
  <circle cx="132" cy="408" r="3" fill="#4a4a4a"/><circle cx="152" cy="408" r="3" fill="#4a4a4a"/>
  <circle cx="166" cy="392" r="3.5" fill="#52d17f"/>
  <text x="192" y="404" class="cable">Smart plug <tspan class="why">(optional)</tspan></text>
  <text x="192" y="424" class="why">power-cycles a Mac that froze solid</text>

  <!-- labels -->
  <g>
    <circle cx="352" cy="128" r="14" fill="#3b7dd8"/><text x="352" y="133" text-anchor="middle" class="n">1</text>
    <text x="374" y="126" class="cable">HDMI</text><text x="374" y="146" class="why">its eyes</text>
  </g>
  <g>
    <circle cx="352" cy="292" r="14" fill="#2e9e5b"/><text x="352" y="297" text-anchor="middle" class="n">2</text>
    <text x="374" y="290" class="cable">USB-C</text><text x="374" y="310" class="why">its hands, even at</text><text x="374" y="328" class="why">the FileVault screen</text>
  </g>
  <g>
    <circle cx="726" cy="150" r="14" fill="#e28a2b"/><text x="726" y="155" text-anchor="middle" class="n">3</text>
    <text x="748" y="148" class="cable">Ethernet</text><text x="748" y="168" class="why">its reach</text>
  </g>

  <!-- reach -->
  <g filter="url(#lift)">
    <rect x="852" y="96" width="270" height="220" rx="20" class="card" fill="#fffdf9"/>
  </g>
  <text x="876" y="130" class="name">From anywhere</text>
  <g>
    <rect x="876" y="148" width="222" height="40" rx="10" class="r1" fill="#f1ecff"/>
    <text x="892" y="173" class="route">Your tailnet</text><text x="1084" y="173" text-anchor="end" class="small">tag:kvm</text>
    <rect x="876" y="196" width="222" height="40" rx="10" class="r2" fill="#eaf6ee"/>
    <text x="892" y="221" class="route">Your LAN</text><text x="1084" y="221" text-anchor="end" class="small">at home</text>
    <rect x="876" y="244" width="222" height="40" rx="10" class="r3" fill="#fff1e2"/>
    <text x="892" y="269" class="route">GitHub outbox</text><text x="1084" y="269" text-anchor="end" class="small">no open port</text>
  </g>
  <text x="987" y="350" text-anchor="middle" class="small">your agents · your phone</text>
</svg>
