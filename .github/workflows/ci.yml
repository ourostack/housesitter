name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install --omit=dev --no-audit --no-fund
      # Every tracked source file, not only what the tests import: a syntax error in an unimported module must fail CI too.
      - run: git ls-files -z '*.mjs' '*.js' | xargs -0 -n1 node --check
      - run: node --test test/*.test.mjs
      - run: node bin/housesitter.mjs demo
  sitter:
    name: sitter on python ${{ matrix.python }}
    # ubuntu-latest moved to 26.04 on 2026-11-16, which has no Python 3.9 build; 24.04 still does.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        # GLKVM ships 3.12; older PiKVM images have 3.9. The sitter is standard library only.
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::SyntaxWarning -m unittest discover -s test -p 'test_*.py' -v
  actions:
    # The generator runs TypeScript as it is, which needs Node 22.18 or later.
    name: actions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/ouro-actions/ouro-actions.mts check actions/housesitter.actions.mts actions/generated
  ci:
    name: ci
    if: always()
    needs: [node, sitter, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.node.result }}" = success && test "${{ needs.sitter.result }}" = success && test "${{ needs.actions.result }}" = success
