name: media
# Renders the terminal recording (docs/tapes/*.tape) with vhs and uploads it, so nobody makes it by hand and
# nobody runs a browser on a shared machine for it. Download the artifact and commit it with the change it shows.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/media.yml', 'docs/tapes/**', 'src/**', 'bin/**', 'assets/evening.json', 'device/sitter.py']
permissions:
  contents: read
jobs:
  vhs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # vhs-action downloads the latest ffmpeg on every run and fails when that host returns 504 (#20), so install
      # vhs's dependencies from the runner's apt cache and the vhs release from GitHub instead.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg ttyd
      - run: |
          gh release download "$VHS_VERSION" -R charmbracelet/vhs -p 'vhs_*_amd64.deb' -D "$RUNNER_TEMP"
          sudo dpkg -i "$RUNNER_TEMP"/vhs_*_amd64.deb
        env:
          GH_TOKEN: ${{ github.token }}
          VHS_VERSION: v0.12.1
      - run: vhs docs/tapes/demo.tape
      - run: vhs docs/tapes/night.tape
      - uses: actions/upload-artifact@v4
        with:
          name: media
          path: |
            docs/img/demo.gif
            docs/img/night.gif
