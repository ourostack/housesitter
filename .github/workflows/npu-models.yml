name: npu-models
# Builds the clock readers housesitter runs on the KVM's NPU (RV1126B) from npu/*.onnx. rknn-toolkit2 is
# Linux-only, so models are converted here, never on the KVM or a Mac. Pinned to 2.3.2, the runtime on the GL.iNet Comet.
# The PP-OCRv4 conversion from the spike lives on the npu-spike branch, kept for the record.
on:
  push:
    branches: [main]
    paths: [npu/**, .github/workflows/npu-models.yml]
  pull_request:
    paths: [npu/**, .github/workflows/npu-models.yml]
  workflow_dispatch:
jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Toolkit
        run: pip install -q rknn-toolkit2==2.3.2 onnx==1.16.1
      - name: Convert the clock readers for rv1126b
        run: |
          python - <<'PY'
          import glob, os
          from rknn.api import RKNN
          for src in sorted(glob.glob("npu/*.onnx")):
              r = RKNN(verbose=False)
              r.config(mean_values=[[0]], std_values=[[255]], target_platform="rv1126b")
              out = "out/" + os.path.basename(src)[:-5] + ".rknn"
              os.makedirs("out", exist_ok=True)
              ret = r.load_onnx(model=src) or r.build(do_quantization=False) or r.export_rknn(out)
              assert ret == 0, (src, ret)
              r.release()
          PY
          sha256sum npu/*.onnx out/*.rknn device/npu/*.rknn
          ls -l out device/npu
      - uses: actions/upload-artifact@v4
        with:
          name: clock-rknn
          path: out/*.rknn
